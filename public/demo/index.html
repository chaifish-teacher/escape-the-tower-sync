<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>【示範】Escape the Tower｜外貌形容詞</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#F0821E; --orange-d:#C9650C; --blue:#2A9BD0; --blue-d:#1B77A3;
  --ink:#1F2430; --muted:#5B6270; --paper:#FFFBF2; --card:#FFFFFF; --line:#E7DCC6;
  --good:#2E9E5B; --bad:#D9483B; --gold:#F5C330;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Fredoka",-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);
  background:#cfe8f5 url(/img/bg.jpg) center/cover fixed;-webkit-user-select:none;user-select:none}
.zh{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-weight:500}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
#app{max-width:1100px;margin:0 auto;padding:16px 16px 40px;min-height:100%}
.panel{background:rgba(255,251,242,.96);border-radius:26px;padding:22px;box-shadow:0 10px 30px rgba(20,40,60,.18);border:3px solid #fff}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back{background:#fff;border:3px solid var(--line);border-radius:14px;padding:8px 14px;font-weight:600}
.top h1{margin:0;font-size:26px;flex:1}
.guide{background:#EAF6FC;border-left:6px solid var(--blue);border-radius:12px;padding:10px 14px;margin:0 0 16px;font-size:17px;line-height:1.5}
.guide b{color:var(--blue-d)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:16px;font-weight:700;font-size:19px;
  background:var(--orange);color:#fff;box-shadow:0 5px 0 var(--orange-d);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--orange-d)}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 var(--blue-d)}
.btn.ghost{background:#fff;color:var(--ink);border:3px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.hidden{display:none!important}

/* HOME */
.hero{border-radius:26px;overflow:hidden;position:relative;aspect-ratio:4/2.2;background:url(/img/cover.jpg) center 45%/cover;border:4px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.mcard{background:#fff;border-radius:22px;padding:16px 14px;text-align:left;border:3px solid var(--line);box-shadow:0 6px 0 var(--line);position:relative;min-height:128px}
.mcard:active{transform:translateY(3px);box-shadow:0 3px 0 var(--line)}
.mcard .n{position:absolute;top:12px;right:14px;width:34px;height:34px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:700}
.mcard h3{margin:4px 0 4px;font-size:23px}
.mcard p{margin:0;color:var(--muted);font-size:15px;line-height:1.4}
.mcard .ico{font-size:30px}
.mcard.game{background:linear-gradient(135deg,#FFE7CF,#FFF6E8);border-color:var(--orange);box-shadow:0 6px 0 var(--orange-d)}
.mcard.game .n{background:var(--blue)}
@media (max-width:760px){.menu{grid-template-columns:1fr 1fr}}

/* CARDS */
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:10px 18px;border-radius:999px;background:#fff;border:3px solid var(--line);font-weight:700;font-size:17px}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.wcard{background:#fff;border-radius:var(--r);border:3px solid var(--line);padding:10px;text-align:center;box-shadow:0 5px 0 var(--line);position:relative}
.wcard:active{transform:translateY(2px)}
.wcard .pic{height:140px;display:grid;place-items:center}
.wcard .pic img{max-height:140px;max-width:100%;object-fit:contain}
.wcard .en{font-size:22px;font-weight:700;margin-top:6px}
.wcard .zhw{font-size:16px;color:var(--muted)}
.wcard .us{font-size:13px;color:var(--blue-d);margin-top:2px}
.wcard .spk{position:absolute;top:8px;right:8px;font-size:18px;opacity:.7}
.wcard.playing{border-color:var(--orange);box-shadow:0 5px 0 var(--orange-d)}

/* MATCH */
.match{display:grid;grid-template-columns:1fr 1.4fr;gap:16px}
.sents{display:flex;flex-direction:column;gap:10px}
.sent{background:#fff;border:3px solid var(--line);border-radius:14px;padding:12px 14px;font-size:20px;font-weight:600;text-align:left}
.sent.sel{border-color:var(--orange);background:#FFF1E2}
.sent.done,.mpic.done{border-color:var(--good);background:#E8F7EE;opacity:.75;pointer-events:none}
.mpics{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.mpic{background:#fff;border:3px solid var(--line);border-radius:14px;height:150px;display:grid;place-items:center;padding:6px;position:relative}
.mpic img{max-height:136px;max-width:100%;object-fit:contain}
.mpic .tag{position:absolute;bottom:4px;left:4px;right:4px;background:var(--good);color:#fff;border-radius:8px;font-size:13px;padding:2px 4px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.08)}}
.progress{height:14px;background:#fff;border-radius:999px;border:2px solid var(--line);overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--good);transition:width .3s}

/* QUIZ */
.qbox{text-align:center}
.qprompt{font-size:26px;font-weight:700;margin:6px 0 14px}
.qbig img{max-height:200px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:720px;margin:0 auto}
.opt{background:#fff;border:3px solid var(--line);border-radius:16px;padding:14px;font-size:22px;font-weight:700;min-height:70px;display:grid;place-items:center}
.opt img{max-height:130px;max-width:100%}
.opt.right{border-color:var(--good);background:#E8F7EE}
.opt.wrong{border-color:var(--bad);background:#FDECEA}

/* WARM UP */
.people{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.person{background:#fff;border:3px solid var(--line);border-radius:16px;height:180px;position:relative;display:grid;place-items:end center;overflow:hidden}
.person img{max-height:170px;max-width:100%;object-fit:contain}
.person .num{position:absolute;top:8px;left:8px;width:36px;height:36px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;border:3px solid #fff}
.person.right{border-color:var(--good);box-shadow:0 0 0 5px rgba(46,158,91,.3)}
.person.wrong{border-color:var(--bad)}
.desc{background:#fff;border:3px dashed var(--blue);border-radius:16px;padding:14px 16px;font-size:24px;font-weight:600;margin-bottom:14px;min-height:64px}
@media (max-width:760px){.people{grid-template-columns:repeat(2,1fr)}}

/* ESCAPE */
.estat{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.chip{background:#fff;border:3px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:17px}
.code{display:flex;gap:6px}
.code span{width:40px;height:46px;border-radius:10px;background:#1F2430;color:var(--gold);display:grid;place-items:center;font-size:26px;font-weight:700}
.code span.empty{background:#fff;border:3px dashed #B9AE97;color:#B9AE97}
.mhead{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.mhead img{width:110px}
.mhead h2{margin:0;font-size:30px}
.task{background:var(--orange);color:#fff;border-radius:14px;padding:10px 16px;font-size:19px;font-weight:600;margin-top:4px}
.hintbox{background:#FFF7D6;border:3px solid var(--gold);border-radius:14px;padding:12px 16px;font-size:18px;line-height:1.55;margin:12px 0}
.ppl{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pp{background:#fff;border:3px solid var(--line);border-radius:14px;height:300px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:6px;position:relative}
.pp img{max-height:250px;max-width:100%;object-fit:contain}
.pp .num{width:40px;height:40px;border-radius:50%;background:#fff;border:4px solid var(--orange);color:var(--orange);display:grid;place-items:center;font-weight:700;font-size:20px;margin-top:4px}
.pp.sel{border-color:var(--blue);background:#EAF6FC}
@media (max-width:760px){.ppl{grid-template-columns:repeat(3,1fr)}}
.flow{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center}
.flow .woman{background:#fff;border-radius:16px;border:3px solid var(--line);padding:8px;text-align:center}
.flow .woman img{max-height:420px;max-width:100%}
.fq{font-size:28px;font-weight:700;margin:6px 0 16px}
.path{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.path span{background:#EAF6FC;border-radius:999px;padding:4px 10px;font-size:14px}
.ans2{display:flex;gap:14px}
.ans2 .btn{min-width:150px;font-size:24px;padding:16px 22px}
.words{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wrow{background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px;display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}
.wrow.ok{border-color:var(--good);background:#F1FAF4}
.wrow .wp{height:84px;display:grid;place-items:center}
.wrow .wp img{max-height:84px;max-width:96px;object-fit:contain}
.boxes{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:6px}
.boxes .gap{width:10px}
.boxes b{width:26px;height:32px;border:2px solid #9AA3B2;display:grid;place-items:center;font-size:19px;text-transform:lowercase;background:#fff}
.boxes b.blue{background:var(--blue);color:#fff;border-color:var(--blue-d)}
.wrow input{width:100%;padding:8px 10px;border:2px solid var(--line);border-radius:10px;font-size:18px}
.wrow .wh{font-size:14px;color:var(--muted)}
@media (max-width:900px){.words{grid-template-columns:1fr}}
.boxes{flex-wrap:nowrap}
.choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.choice{background:#fff;border:3px solid var(--blue);border-radius:14px;padding:10px 16px;font-size:21px;font-weight:700;color:var(--blue-d)}
.choice .k{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;margin-right:8px;font-size:16px}
.counts{display:grid;gap:8px;margin:10px 0}
.count{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:12px;padding:8px 12px;font-size:19px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:12px;background:#EAF6FC;font-size:24px;font-weight:700}
.stepper span{width:30px;text-align:center;font-size:24px;font-weight:700}
.cool{position:fixed;inset:0;background:rgba(31,36,48,.78);display:grid;place-items:center;z-index:50;color:#fff;text-align:center}
.cool .big{font-size:90px;font-weight:700}
.clear{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#F7962F,#D35E08);text-align:center;padding:20px}
.clear .t{font-size:44px;font-weight:700;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.15)}
.clear .team{font-size:120px;font-weight:700;color:#fff;line-height:1;text-shadow:0 5px 0 var(--orange-d)}
.clear .digit{display:inline-grid;place-items:center;width:110px;height:130px;border-radius:20px;background:#1F2430;color:var(--gold);font-size:90px;font-weight:700;margin:12px 0}
.clear .msg{font-size:24px;color:#fff;margin:6px 0 18px}
.keypad{display:grid;grid-template-columns:repeat(3,90px);gap:10px;justify-content:center;margin-top:14px}
.keypad button{height:74px;border-radius:16px;background:#fff;border:3px solid var(--line);font-size:32px;font-weight:700;box-shadow:0 4px 0 var(--line)}
.lockcode{display:flex;gap:10px;justify-content:center;margin:10px 0}
.lockcode span{width:70px;height:84px;border-radius:14px;background:#1F2430;color:var(--gold);display:grid;place-items:center;font-size:52px;font-weight:700}
.field{padding:12px 14px;border-radius:14px;border:3px solid var(--line);font-size:22px;width:100%;max-width:340px;text-align:center;text-transform:uppercase;letter-spacing:4px}
.teams{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:12px 0}
.teams button{height:76px;border-radius:16px;background:#fff;border:3px solid var(--line);font-size:30px;font-weight:700}
.teams button.on{background:var(--orange);color:#fff;border-color:var(--orange-d)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-size:19px;z-index:80;max-width:90vw;text-align:center}

/* EXIT */
.exitwrap{display:grid;grid-template-columns:260px 1fr;gap:18px}
.exitpic{background:#fff;border:3px solid var(--line);border-radius:16px;height:300px;display:grid;place-items:center;padding:8px}
.exitpic img{max-height:280px;max-width:100%}
textarea{width:100%;min-height:130px;border-radius:14px;border:3px solid var(--line);padding:12px;font:inherit;font-size:22px;resize:vertical;-webkit-user-select:text;user-select:text}
input{-webkit-user-select:text;user-select:text}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chips button{background:#EAF6FC;border:2px solid #BFE2F2;border-radius:999px;padding:6px 12px;font-size:17px;font-weight:600}
.chips.w button{background:#FFF1E2;border-color:#F7CFA7}
@media (max-width:760px){.exitwrap,.flow,.match{grid-template-columns:1fr}}
</style>
</head>
<body>
<div style="position:fixed;left:0;right:0;bottom:0;z-index:999;background:#7B3FA0;color:#fff;text-align:center;font:600 14px -apple-system,'PingFang TC',sans-serif;padding:4px">🧪 示範版（試玩用，與正式上課的資料分開）</div>
<div id="app"></div>
<script>
const API_BASE = location.pathname.startsWith('/demo') ? '/api/demo' : '/api';
/* ============ DATA ============ */
const W = [
 // hair
 {id:'longhair',en:'long hair',zh:'長髮',cat:'hair',s:'She has long hair.'},
 {id:'shorthair',en:'short hair',zh:'短髮',cat:'hair',s:'She has short hair.'},
 {id:'straight',en:'straight hair',zh:'直髮',cat:'hair',s:'She has straight hair.'},
 {id:'curly',en:'curly hair',zh:'捲髮',cat:'hair',s:'He has curly hair.'},
 {id:'dark',en:'dark hair',zh:'深色頭髮',cat:'hair',s:'He has dark hair.'},
 {id:'blonde',en:'blonde hair',zh:'金髮',cat:'hair',s:'She has blonde hair.'},
 {id:'bald',en:'bald',zh:'禿頭的',cat:'hair',s:"He's bald."},
 // body & face
 {id:'young',en:'young',zh:'年輕的',cat:'body',s:"He's young."},
 {id:'elderly',en:'elderly',zh:'年長的',cat:'body',s:"He's elderly."},
 {id:'tall',en:'tall',zh:'高的',cat:'body',s:"She's tall."},
 {id:'short',en:'short',zh:'矮的',cat:'body',s:"She's short."},
 {id:'slim',en:'slim',zh:'苗條的',cat:'body',s:'She is slim.'},
 {id:'beard',en:'a beard',zh:'鬍子（下巴的）',cat:'body',s:'He has a beard.'},
 {id:'moustache',en:'a moustache',zh:'小鬍子（嘴唇上方）',cat:'body',s:'He has a moustache.',us:'美式拼法：mustache'},
 // clothes
 {id:'glasses',en:'glasses',zh:'眼鏡',cat:'clothes',s:'He is wearing glasses.'},
 {id:'scarf',en:'a scarf',zh:'圍巾',cat:'clothes',s:'She is wearing a scarf.'},
 {id:'gloves',en:'gloves',zh:'手套',cat:'clothes',s:'He is wearing gloves.'},
 {id:'shoes',en:'shoes',zh:'鞋子',cat:'clothes',s:'She is wearing shoes.'},
 {id:'cap',en:'a cap',zh:'鴨舌帽',cat:'clothes',s:'He is wearing a cap.'},
 {id:'hat',en:'a hat',zh:'帽子',cat:'clothes',s:'She is wearing a hat.'},
 {id:'trousers',en:'trousers',zh:'長褲',cat:'clothes',s:'He is wearing trousers.',us:'美式英文：pants'},
 {id:'handbag',en:'a handbag',zh:'手提包',cat:'clothes',s:'She is carrying a handbag.'},
 {id:'jacket',en:'a jacket',zh:'夾克、外套',cat:'clothes',s:'He is wearing a jacket.'},
 {id:'jumper',en:'a jumper',zh:'毛衣',cat:'clothes',s:'She is wearing a jumper.',us:'美式英文：sweater'},
];
const byId = Object.fromEntries(W.map(w=>[w.id,w]));
const CATS = {hair:'💇 頭髮 Hair',body:'🧍 身材・年齡・鬍子',clothes:'🧥 服裝配件 Clothes'};
const img = id => `/img/${id}.webp`;

/* ============ HELPERS ============ */
const $ = s => document.querySelector(s);
const app = $('#app');
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };
const store = {
  get(k,d){ try{ const v=localStorage.getItem('demo:'+k); return v?JSON.parse(v):d }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem('demo:'+k,JSON.stringify(v)) }catch(e){} },
  del(k){ try{ localStorage.removeItem('demo:'+k) }catch(e){} }
};
let voice=null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v=>/en-GB/i.test(v.lang)&&/Daniel|Kate|Serena|Google UK/i.test(v.name)) || vs.find(v=>/en-GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
  }catch(e){}
}
try{ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }catch(e){}
function speak(t, rate=0.85){
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    if(voice) u.voice = voice; u.lang = voice?voice.lang:'en-GB'; u.rate = rate;
    speechSynthesis.speak(u);
  }catch(e){ toast('這台裝置無法播放語音，請聽老師唸 🙂') }
}
function toast(msg, ms=2200){
  const t=document.createElement('div'); t.className='toast zh'; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(),ms);
}
function topbar(title){
  return `<div class="top"><button class="back zh" onclick="go('home')">← 回首頁</button><h1>${title}</h1></div>`;
}
function go(v){ view=v; window.scrollTo(0,0); render(); }
let view='home';

/* ============ HOME ============ */
function home(){
  app.innerHTML = `
  <div class="hero"></div>
  <div class="menu">
    <button class="mcard" onclick="go('warm')"><span class="n">1</span><div class="ico">🕵️</div><h3>暖身 Guess Who</h3><p class="zh">聽老師描述，找出是哪一個人！</p></button>
    <button class="mcard" onclick="go('cards')"><span class="n">2</span><div class="ico">🃏</div><h3>單字卡 Words</h3><p class="zh">點圖片聽發音，認識 24 個單字。</p></button>
    <button class="mcard" onclick="go('match')"><span class="n">3</span><div class="ico">🔗</div><h3>配對練習 Match</h3><p class="zh">把句子和圖片配成一對。</p></button>
    <button class="mcard" onclick="go('quiz')"><span class="n">4</span><div class="ico">⚡</div><h3>快問快答 Quiz</h3><p class="zh">看圖選單字，8 題小測驗！</p></button>
    <button class="mcard game" onclick="go('escape')"><span class="n">5</span><div class="ico">🏰</div><h3>密室逃脫 Escape!</h3><p class="zh">${es.started&&!es.end?`<b style="color:var(--orange-d)">🔥 第 ${es.team} 組闖關中，點這裡繼續！</b>`:es.end?'🎉 已成功逃脫！':'分組闖關，打敗 4 隻怪獸逃出高塔！<br>（要看投影上的開始碼才能進入）'}</p></button>
    <button class="mcard" onclick="go('exit')"><span class="n">6</span><div class="ico">✍️</div><h3>出場卷 Exit Ticket</h3><p class="zh">用兩句英文描述一個人。</p></button>
  </div>
  <div style="text-align:right;margin-top:14px"><button class="zh" style="font-size:13px;color:#fff;background:rgba(31,36,48,.45);border-radius:999px;padding:6px 12px" onclick="teacherReset()">⚙ 老師重設</button></div>`;
}

/* ============ 1. WARM UP ============ */
const WARM_PEOPLE = ['longhair','curly','beard','bald','blonde','dark','young','elderly'];
const WARM_ROUNDS = [
  {t:"She has long curly hair. She's wearing glasses.",a:'longhair'},

const CONFLICT={longhair:['curly','straight','slim','tall'],straight:['longhair','dark'],curly:['longhair','shorthair','young'],shorthair:['dark','curly','blonde','elderly','beard','moustache'],

    const same=shuffle(W.filter(x=>!bad.has(x.id)&&x.cat===w.cat)), rest=shuffle(W.filter(x=>!bad.has(x.id)&&x.cat!==w.cat));

function askHint(k){
  const left=HINT_MAX-hintCount();
  const box=document.createElement('div'); box.className='cool';
  box.innerHTML=`<div class="panel" style="color:var(--ink);max-width:440px;text-align:center"><div style="font-size:44px">💡</div>
   <div class="zh" style="font-size:22px;font-weight:700;margin:6px 0">確定要用提示嗎？</div>
   <p class="zh" style="font-size:18px">整場遊戲每組只有 <b>${HINT_MAX} 次</b>提示，用完就沒有了。<br>用了之後還剩 <b>${left-1}</b> 次。</p>
   <div class="row" style="justify-content:center"><button class="btn ghost zh" id="hno">再想想</button><button class="btn zh" id="hyes">使用提示</button></div></div>`;
  document.body.appendChild(box);
  $('#hno').onclick=()=>box.remove();
  $('#hyes').onclick=()=>{ box.remove(); useHint(k); };
}
function useHint(k){ if(!es.hints[k] && hintCount()<HINT_MAX){ es.hints[k]=1; save(); } escapeView(); }
function wrongAns(msg){
  es.wrong++; es.cool=Date.now()+8000; save(); showCool(msg);
}
function showCool(msg){
  let el=$('.cool'); if(!el){ el=document.createElement('div'); el.className='cool'; document.body.appendChild(el); }
  const upd=()=>{ const left=Math.ceil((es.cool-Date.now())/1000);
    if(left<=0){ clearInterval(coolTimer); el.remove(); return; }
    el.innerHTML=`<div><div style="font-size:60px">🥶</div><div class="zh" style="font-size:30px;font-weight:700">${msg||'答錯了！被怪獸凍結'}</div><div class="big">${left}</div><div class="zh" style="font-size:20px">趁這段時間，小組再討論一下！</div></div>`; };
  clearInterval(coolTimer); upd(); coolTimer=setInterval(upd,250);
}
function cleared(stage,digit){
  es.digits[stage-1]=digit; es.stage=stage+1; save();
  const el=document.createElement('div'); el.className='clear';
  el.innerHTML=`<div><div class="t zh">第 ${stage} 關 通過！🎉</div><div class="zh" style="font-size:26px;color:#fff">第 ${es.team} 組</div>
   <div class="zh" style="font-size:22px;color:#fff;margin-top:8px">密碼第 ${stage} 位是</div><div class="digit">${digit}</div>
   <div class="msg zh">${net.online===false?'⚠️ 網路沒連上，進度會自動補傳。<br>如果一直沒連上，請舉手給老師看這個畫面。':'✅ 已經自動回報給老師了！'}</div>
   <button class="btn blue" style="font-size:24px" onclick="this.closest('.clear').remove();escapeView()">${stage<4?'下一關 →':'去開鎖 🔐'}</button></div>`;
  document.body.appendChild(el); speak('Well done!');
}

/* --- Monster 1 --- */
const M1T="This person is tall and slim. They have short brown hair. They're wearing blue jeans and a shirt. They're wearing brown shoes. They don't have a moustache or a beard.";
function m1View(){
  app.innerHTML=`<div class="panel">${estat()}
   ${mhead('m1','The First Monster','Which person am I describing? 我描述的是哪一個人？')}
   <div class="desc" style="font-size:21px;line-height:1.5">${M1T} <button class="btn blue" style="padding:6px 12px;font-size:16px" onclick="speak(M1T)">🔊</button></div>
   ${hintBtn('m1',`這個人：高又瘦、<b>棕色短髮</b>、穿<b>藍色牛仔褲 (blue jeans)</b> 和襯衫、穿<b>棕色鞋子</b>、<b>沒有</b>小鬍子也沒有鬍子。<br>👉 先刪掉褲子不是藍色的人，再看鞋子和鬍子！`)}
   <div class="ppl" style="margin-top:12px">${[1,2,3,4,5,6].map(n=>`<button class="pp ${es.m1===n?'sel':''}" onclick="es.m1=${n};save();m1View()"><img src="${img('p'+n)}" alt=""><span class="num">${n}</span></button>`).join('')}</div>
   <div class="center" style="margin-top:14px"><button class="btn" ${es.m1?'':'disabled'} onclick="m1Check()">✅ 確定是 ${es.m1??'?'} 號！</button></div></div>`;
}
function m1Check(){ if(Date.now()<es.cool) return showCool(); if(es.m1===3) cleared(1,3); else { es.m1=null; wrongAns('不是這個人喔！'); m1View(); } }

/* --- Monster 2 --- */
function m2View(){
  const n=FLOW[es.m2];
  app.innerHTML=`<div class="panel">${estat()}
   ${mhead('m2','The Second Monster','Answer the questions about the woman. 回答關於這位女生的問題，一路走到最後的數字！')}
   <div class="flow"><div class="woman"><img src="${img('woman')}" alt=""></div>
   <div>
     <div class="path">${es.m2path.map(p=>`<span>${p}</span>`).join('')||'<span class="zh">從第一個問題開始 ⬇️</span>'}</div>
     <div class="fq">${n.q} <button class="btn blue" style="padding:6px 12px;font-size:16px" onclick="speak(FLOW[es.m2].q)">🔊</button></div>
     <div class="ans2">${n.a.map(([l,nx])=>`<button class="btn ${l==='NO'||l==='BLUE'||l==='BROWN'?'blue':''}" onclick="m2Go('${l}','${nx}')">${l}</button>`).join('')}</div>
     <div style="margin-top:16px">${hintBtn('m2',`這一題的意思：<b>${n.zh}</b><br>仔細看左邊的圖：她穿的是米白色的<b>毛衣 (jumper)</b>，不是夾克！`)}</div>
   </div></div></div>`;
}
function m2Go(label,nx){
  if(Date.now()<es.cool) return showCool();
  es.m2path.push(FLOW[es.m2].q.replace(/\?$/,'')+' → '+label);
  if(nx.startsWith('q')){ es.m2=nx; save(); m2View(); return; }
  const num=+nx;
  if(num===4){ cleared(2,4); }
  else { es.m2='q0'; es.m2path=[]; wrongAns(`走到了 ${num}，不是正確答案！從頭再走一次`); m2View(); }
}

/* --- Monster 3 --- */
function boxes(w,val){
  const letters=val.toLowerCase().replace(/[^a-z]/g,'');
  let k=0,h='';
  w.g.forEach((len,gi)=>{ if(gi) h+='<span class="gap"></span>'; for(let j=0;j<len;j++,k++){ h+=`<b class="${k===w.b?'blue':''}">${letters[k]||''}</b>`; } });
  return h;
}
function m3View(){
  const ok=M3W.map((w,i)=>(es.m3[i]||'').toLowerCase().replace(/[^a-z]/g,'')===w.ans);
  const all=ok.every(Boolean);
  app.innerHTML=`<div class="panel">${estat()}
   ${mhead('m3','The Third Monster','What are these words? 寫出每張圖的單字，藍色格子的字母會拼出一個祕密單字！')}
   <p class="guide zh">⌨️ 在框框裡打字，格子會自動填上字母。答對會變<b style="color:var(--good)">綠色</b>。全部答對才能選出祕密單字！</p>
   ${hintBtn('m3',M3W.map((w,i)=>`${i+1}. ${w.zh}　→ 開頭字母 <b>${w.ans[0]}</b>`).join('<br>'))}
   <div class="words" style="margin-top:12px">${M3W.map((w,i)=>`<div class="wrow ${ok[i]?'ok':''}" id="wr${i}"><div class="wp"><img src="${img(w.img)}" alt=""></div>
     <div><div class="boxes" id="bx${i}">${boxes(w,es.m3[i]||'')}</div>
     <input id="in${i}" value="${(es.m3[i]||'').replace(/"/g,'')}" placeholder="${ok[i]?'':'type here…'}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" oninput="m3Type(${i},this.value)" ${ok[i]?'readonly':''}></div></div>`).join('')}</div>
   <div id="m3choose" style="margin-top:18px" class="${all?'':'hidden'}">
     <div class="center" style="font-size:22px;font-weight:700;margin-bottom:10px">Which word is spelled out in the blue letters? <span class="zh">藍色字母拼出哪個字？</span></div>
     <div class="choices">${['English','encrypt','easiest','engines','equally'].map((t,k)=>`<button class="choice" onclick="m3Pick(${k+1})"><span class="k">${k+1}</span>${t}</button>`).join('')}</div>
   </div></div>`;
}
function m3Type(i,v){
  es.m3[i]=v; save();
  const w=M3W[i]; $('#bx'+i).innerHTML=boxes(w,v);
  const good=v.toLowerCase().replace(/[^a-z]/g,'')===w.ans;
  if(good){ $('#wr'+i).classList.add('ok','pop'); $('#in'+i).readOnly=true; $('#in'+i).blur(); speak(w.ans.replace('hair',' hair'));
    const all=M3W.every((w,j)=>(es.m3[j]||'').toLowerCase().replace(/[^a-z]/g,'')===w.ans);
    if(all){ $('#m3choose').classList.remove('hidden'); toast('全部答對！看看藍色字母拼出什麼字 👀'); }
  }
}
function m3Pick(k){ if(Date.now()<es.cool) return showCool(); if(k===1) cleared(3,1); else { wrongAns('不是這個字！再看一次藍色字母的順序'); } }

/* --- Monster 4 --- */
const M4Q=[['wear glasses','戴眼鏡'],['have curly hair','捲髮'],['have short hair','短髮'],['have blonde hair','金髮']];
function m4View(){
  app.innerHTML=`<div class="panel">${estat()}
   ${mhead('m4','The Fourth Monster','Which number sequence is correct? 數一數，哪一組數字是正確的？')}
   <div style="display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start">
    <div style="background:#fff;border-radius:16px;border:3px solid var(--line);padding:8px"><img src="${img('group')}" style="width:100%"></div>
    <div><div class="zh" style="font-weight:700;margin-bottom:4px">✏️ 先數一數（這裡是草稿，不會計分）</div>
     <div class="counts">${M4Q.map(([q,zh],i)=>`<div class="count"><div>The number of people who <b>${q}</b><div class="zh" style="font-size:14px;color:var(--muted)">${zh}的人數</div></div>
       <div class="stepper"><button onclick="m4c(${i},-1)">−</button><span>${es.m4c[i]}</span><button onclick="m4c(${i},1)">+</button></div></div>`).join('')}</div>
     <div class="center" style="font-weight:700;margin:8px 0">你們的數字：<span style="font-size:26px;letter-spacing:4px">${es.m4c.join('')}</span></div>
    </div></div>
   ${hintBtn('m4','只有 <b>1 個人</b>戴眼鏡，也只有 <b>1 個人</b>是捲髮。<br>👉 找找看：哪一個選項是 <b>1 1</b> 開頭？')}
   <div class="center" style="font-size:22px;font-weight:700;margin:14px 0 10px">Which number sequence is correct?</div>
   <div class="choices">${['1224','1131','3313','1432'].map((t,k)=>`<button class="choice" onclick="m4Pick(${k+1})"><span class="k">${k+1}</span>${t}</button>`).join('')}</div></div>`;
}
function m4c(i,d){ es.m4c[i]=Math.max(0,Math.min(4,es.m4c[i]+d)); save(); m4View(); }
function m4Pick(k){ if(Date.now()<es.cool) return showCool(); if(k===2) cleared(4,2); else wrongAns('數字不對！再數一次'); }

/* --- Lock --- */
function lockView(){
  app.innerHTML=`<div class="panel center">${estat()}
   <img src="${img('lock')}" style="height:150px" id="lockimg">
   <h2 style="font-size:30px;margin:6px 0">Put together your clues! 輸入 4 位數密碼開鎖</h2>
   <p class="zh" style="font-size:18px;color:var(--muted)">按照第 1 → 4 隻怪獸的順序輸入</p>
   <div class="lockcode">${[0,1,2,3].map(i=>`<span>${es.lock[i]||''}</span>`).join('')}</div>
   <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="lk('${n}')">${n}</button>`).join('')}<button onclick="lk('del')">⌫</button><button onclick="lk('0')">0</button><button onclick="lk('go')" style="background:var(--good);color:#fff;border-color:#237a46">✓</button></div></div>`;
}
function lk(k){
  if(Date.now()<es.cool) return showCool();
  if(k==='del') es.lock=es.lock.slice(0,-1);
  else if(k==='go'){ if(es.lock.length<4){ toast('要輸入 4 個數字喔'); return; }
    if(es.lock===CODE.join('')){ es.end=Date.now(); save(); speak('You escaped the tower! Congratulations!'); escapeView(); return; }
    es.lock=''; save(); wrongAns('密碼錯誤！看看上面收集到的數字'); lockView(); return; }
  else if(es.lock.length<4) es.lock+=k;
  save(); lockView();
}
function escapeWin(){
  app.innerHTML=`<div class="clear" style="position:relative;inset:auto;min-height:88vh;border-radius:26px"><div>
    <div style="font-size:80px">🏰🎉🔓</div>
    <div class="t">You escaped the tower!</div>
    <div class="zh" style="font-size:28px;color:#fff;margin:6px 0">第 ${es.team} 組 成功逃脫！</div>
    <div class="team">${fmt(es.end-es.start)}</div>
    <div class="zh" style="font-size:22px;color:#fff;margin-top:10px">💡 提示 ${hintCount()} 次　❌ 錯誤 ${es.wrong} 次</div>
    <div class="msg zh" style="margin-top:16px">${net.online===false?'⚠️ 網路沒連上，請舉手給老師看！':'✅ 已經自動回報給老師了！'}<br>等其他組的時候，去「出場卷」練習描述一個人吧！</div>
    <div class="row" style="justify-content:center"><button class="btn ghost zh" onclick="go('home')">🏠 回首頁</button><button class="btn blue zh" onclick="go('exit')">✍️ 去出場卷</button>
</div></div></div>`;
}
const TEACHER_CODE='9876';
function teacherReset(){
  const box=document.createElement('div'); box.className='cool';
  box.innerHTML=`<div class="panel" style="color:var(--ink);max-width:420px;text-align:center"><div class="zh" style="font-size:22px;font-weight:700;margin-bottom:6px">⚙ 老師重設</div>
   <p class="zh" style="font-size:16px;margin:0 0 10px">清除這台 iPad 的密室逃脫進度（組別、關卡、提示、錯誤、時間）。</p>
   <input id="tpw" class="field" inputmode="numeric" placeholder="老師碼" autocomplete="off" maxlength="4"><div class="row" style="justify-content:center;margin-top:12px">
   <button class="btn ghost zh" id="tno">取消</button><button class="btn zh" id="tgo">清除進度</button></div></div>`;
  document.body.appendChild(box);
  $('#tno').onclick=()=>box.remove();
  $('#tgo').onclick=()=>{ if(($('#tpw').value||'').trim()===TEACHER_CODE){ es=NEW_ES(); save(); teamPick=null; box.remove(); toast('已清除，這台 iPad 可以重新開始 ✓'); go('home'); } else { toast('老師碼不對'); } };
}
function resetAsk(){
  const box=document.createElement('div'); box.className='cool';
  box.innerHTML=`<div class="panel" style="color:var(--ink);max-width:420px"><div class="zh" style="font-size:22px;font-weight:700;margin-bottom:10px">確定要重新開始嗎？</div>
   <p class="zh" style="font-size:17px">目前的闖關進度和時間都會清除。</p><div class="row" style="justify-content:center;margin-top:12px">
   <button class="btn ghost zh" onclick="this.closest('.cool').remove()">取消</button><button class="btn zh" id="rgo">重新開始</button></div></div>`;
  document.body.appendChild(box);
  $('#rgo').onclick=()=>{ es=NEW_ES(); save(); box.remove(); escapeView(); };
}

/* ============ 6. EXIT TICKET ============ */
const EXIT_PICS=['longhair','curly','beard','bald','blonde','dark','young','elderly','moustache','slim','tall','straight','p1','p2','p4','p5','woman'];
let exitPic=EXIT_PICS[Math.floor(Math.random()*EXIT_PICS.length)];
let exitText='';
function exitView(){
  app.innerHTML=`<div class="panel">${topbar('✍️ 出場卷 Exit Ticket')}
   <p class="guide zh">看著圖片，用 <b>2 句英文</b>描述這個人。可以點下面的句型和單字幫忙。寫完按「🔊 唸給我聽」檢查，再舉手給老師看！</p>
   <div class="exitwrap"><div><div class="exitpic"><img src="${img(exitPic)}" alt=""></div>
     <button class="btn ghost zh" style="width:100%;margin-top:10px" onclick="exitPic=EXIT_PICS.filter(p=>p!==exitPic)[Math.floor(Math.random()*(EXIT_PICS.length-1))];exitView()">🔄 換一張圖</button></div>
   <div><textarea id="et" placeholder="He has … / She's wearing …" oninput="exitText=this.value">${exitText.replace(/</g,'&lt;')}</textarea>
     <div class="zh" style="font-weight:700;margin-top:8px">句型</div>
     <div class="chips">${["He has ","She has ","He's ","She's ","He's wearing ","She's wearing ","They have ",". "].map(c=>`<button onclick="ins('${c.replace(/'/g,"\\'")}')">${c.trim()||'.'}</button>`).join('')}</div>
     <div class="zh" style="font-weight:700">單字</div>
     <div class="chips w">${W.map(w=>`<button onclick="ins('${w.en}')">${w.en}</button>`).join('')}<button onclick="ins('brown ')">brown</button><button onclick="ins('blue ')">blue</button><button onclick="ins('black ')">black</button><button onclick="ins('red ')">red</button></div>
     <div class="row"><button class="btn blue" onclick="speak($('#et').value||'Please write something first.')">🔊 唸給我聽</button><button class="btn ghost zh" onclick="exitText='';exitView()">清除</button></div>
   </div></div></div>`;
}
function ins(t){ const ta=$('#et'); ta.value=(ta.value+t).replace(/\s+\./g,'.'); exitText=ta.value; }

/* ============ ROUTER ============ */
function render(){
  if(view!=='escape'){ clearInterval(tick); }
  ({home, warm:warmView, cards:cardsView, match:()=>{ if(!mt.pics.length) matchInit(0); matchView(); }, quiz:quizView, escape:escapeView, exit:exitView})[view]();
  if(view==='escape' && es.cool>Date.now()) showCool();
}
render();
syncRoom(); setInterval(syncRoom,15000);
</script>
