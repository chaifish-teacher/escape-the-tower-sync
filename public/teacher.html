<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape the Tower｜老師端</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--orange:#F0821E;--orange-d:#C9650C;--blue:#2A9BD0;--blue-d:#1B77A3;--ink:#1F2430;--muted:#5B6270;--paper:#FFFBF2;--line:#E7DCC6;--good:#2E9E5B;--bad:#D9483B;--gold:#F5C330}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Fredoka",-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:#F3EBDA}
.zh,td,th,p,li{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{background:var(--ink);color:#fff;padding:12px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:22px;white-space:nowrap}
.phases{display:flex;gap:6px;flex:1;min-width:380px}
.ph{flex:1;border-radius:10px;padding:6px 8px;background:#343B4A;font-size:14px;text-align:center;line-height:1.2;position:relative;overflow:hidden}
.ph .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--gold)}
.ph.on{background:var(--orange)}
.ph.past{opacity:.5}
.ptime{font-size:40px;font-weight:700;min-width:120px;text-align:center;font-variant-numeric:tabular-nums}
.ptime.over{color:#FF8A7A}
.hb{background:#fff;color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:700}
.hb.o{background:var(--orange);color:#fff}
nav{display:flex;gap:8px;padding:12px 18px 0;flex-wrap:wrap}
nav button{padding:10px 18px;border-radius:12px 12px 0 0;background:#E4D8BF;font-weight:700;font-size:17px}
nav button.on{background:#fff}
main{background:#fff;margin:0 18px 18px;border-radius:0 16px 16px 16px;padding:18px;min-height:70vh}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:12px;font-weight:700;background:var(--orange);color:#fff;box-shadow:0 4px 0 var(--orange-d)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.red{background:var(--bad);box-shadow:0 4px 0 #A7342A}
.btn:active{transform:translateY(2px)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.gamebar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#FFF6E8;border:3px solid #F7CFA7;border-radius:16px;padding:12px 16px;margin-bottom:16px}
.gclock{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums}
.gclock small{font-size:18px;color:var(--muted);font-weight:600}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.team{border:3px solid var(--line);border-radius:18px;padding:12px 14px;background:var(--paper);position:relative}
.team.esc{border-color:var(--good);background:#F0FAF3}
.thead{display:flex;align-items:center;gap:10px}
.tnum{width:52px;height:52px;border-radius:14px;background:var(--orange);color:#fff;font-size:30px;font-weight:700;display:grid;place-items:center}
.tname{font-size:20px;font-weight:700;flex:1}
.tscore{font-size:40px;font-weight:700;color:var(--blue-d);font-variant-numeric:tabular-nums}
.track{display:flex;gap:6px;margin:10px 0}
.st{flex:1;height:58px;border-radius:12px;background:#EEE6D6;display:grid;place-items:center;position:relative;filter:grayscale(1);opacity:.45}
.st img{height:44px}
.st.on{filter:none;opacity:1;background:#FFE7CF}
.st .tm{position:absolute;bottom:-2px;right:3px;font-size:11px;color:var(--muted);font-weight:700}
.st.lock{font-size:26px}
.tbtns{display:flex;gap:6px;flex-wrap:wrap}
.tbtns button{border-radius:10px;padding:8px 10px;font-weight:700;font-size:15px;background:#fff;border:2px solid var(--line)}
.tbtns .adv{background:var(--good);color:#fff;border-color:#237a46;flex:1;font-size:17px}
.tbtns .plus{background:#EAF6FC;border-color:#BFE2F2}
.tbtns .minus{background:#FDECEA;border-color:#F5C2BC}
.medal{position:absolute;top:-12px;right:-8px;font-size:36px}
.detail{font-size:13px;color:var(--muted);margin-top:6px}
.rank{display:flex;flex-direction:column;gap:10px;max-width:900px;margin:0 auto}
.rk{display:grid;grid-template-columns:70px 80px 1fr 200px 120px;align-items:center;gap:12px;background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:10px 16px;font-size:26px;font-weight:700}
.rk .pos{font-size:40px;text-align:center}
.rk .stg{display:flex;gap:4px}
.rk .stg img{height:36px;filter:grayscale(1);opacity:.3}
.rk .stg img.on{filter:none;opacity:1}
.rk .sc{font-size:44px;color:var(--blue-d);text-align:right}
.log{margin-top:16px;font-size:14px;color:var(--muted);max-height:160px;overflow:auto;background:#FAF7F0;border-radius:12px;padding:8px 12px}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{border:1px solid var(--line);padding:10px;vertical-align:top;text-align:left;line-height:1.55}
th{background:#FFF1E2}
td.t{white-space:nowrap;font-weight:700;color:var(--orange-d)}
.say{background:#EAF6FC;border-radius:8px;padding:2px 6px;font-family:"Fredoka",sans-serif;font-weight:600;color:var(--blue-d)}
.ans{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.acard{border:3px solid var(--line);border-radius:16px;padding:12px;background:var(--paper)}
.acard img{height:70px;float:right}
.acard .big{font-size:56px;font-weight:700;color:var(--orange-d);line-height:1}
.warm li{font-size:20px;margin-bottom:10px;font-family:"Fredoka",sans-serif}
.warm li b{background:var(--orange);color:#fff;border-radius:8px;padding:0 8px;margin-left:6px}
.modal{position:fixed;inset:0;background:rgba(31,36,48,.6);display:grid;place-items:center;z-index:50}
.modal .box{background:#fff;border-radius:18px;padding:22px;max-width:440px;text-align:center}
.qrwrap{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
#qr{background:#fff;padding:16px;border-radius:16px;border:3px solid var(--line);min-width:300px;min-height:300px;display:grid;place-items:center}
input.url{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);font-size:16px}
.pass{font-size:64px;font-weight:700;letter-spacing:10px;color:var(--orange-d)}
.pts{background:#F0FAF3;border:2px solid #BFE5CC;border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:14px}

/* ===== SLIDES ===== */
.stagewrap{background:#1F2430;border-radius:16px;padding:12px;position:relative}
.stagewrap:fullscreen{border-radius:0;display:flex;flex-direction:column;justify-content:center;padding:0}
.stage{aspect-ratio:16/9;width:100%;max-height:calc(100vh - 230px);margin:0 auto;border-radius:12px;overflow:hidden;position:relative;background:#cfe8f5 url(img/bg.jpg) center/cover;container-type:size}
.stagewrap:fullscreen .stage{max-height:calc(100vh - 64px);border-radius:0}
.slide{position:absolute;inset:3% 3%;background:rgba(255,251,242,.95);border-radius:2.2cqw;padding:2.2cqw 3cqw;display:flex;flex-direction:column}
.slide.full{inset:0;border-radius:0;padding:0;background:url(img/cover.jpg) center/cover}
.slide h2{margin:0 0 1cqw;font-size:4.2cqw;text-align:center}
.slide .sub{font-size:2.1cqw;text-align:center;color:var(--blue-d);margin-bottom:1.2cqw;font-weight:600}
.sgrid{flex:1;display:grid;gap:1.2cqw;min-height:0}
.vc{background:#fff;border:.35cqw solid var(--line);border-radius:1.4cqw;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:.8cqw;min-height:0;position:relative;overflow:hidden}
.vc img{flex:1;min-height:0;max-width:100%;object-fit:contain}
.vc .lab{font-size:2.1cqw;font-weight:700;margin-top:.4cqw;min-height:3cqw;text-align:center;line-height:1.1}
.vc .lab small{display:block;font-size:1.5cqw;color:var(--muted);font-weight:500}
.vc .lab.q{color:#C9BFA8}
.vc.shown{border-color:var(--orange)}
.vc .num{position:absolute;top:.6cqw;left:.6cqw;width:3.4cqw;height:3.4cqw;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:700;font-size:2cqw;border:.3cqw solid #fff}
.vc.hit{border-color:var(--good);box-shadow:0 0 0 .6cqw rgba(46,158,91,.35)}
.sctl{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:10px;color:#fff}
.sctl .btn{padding:8px 14px}
.sdots{display:flex;gap:6px}
.sdots i{width:10px;height:10px;border-radius:50%;background:#4A5263;cursor:pointer}
.sdots i.on{background:var(--gold)}
.wdesc{background:#fff;border:.35cqw dashed var(--blue);border-radius:1.4cqw;padding:1cqw 1.6cqw;font-size:2.8cqw;font-weight:600;text-align:center;margin-bottom:1.2cqw;min-height:5cqw}
.rbtns{display:flex;gap:.8cqw;justify-content:center;margin-bottom:1cqw}
.rbtns button{font-size:1.8cqw;padding:.5cqw 1.4cqw;border-radius:1cqw;background:#fff;border:.25cqw solid var(--line);font-weight:700}
.rbtns button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.6cqw;flex:1}
.pc{background:#fff;border-radius:1.6cqw;border:.4cqw solid var(--line);padding:1.6cqw;display:flex;flex-direction:column}
.pc .f{font-size:2.4cqw;font-weight:700;color:#fff;border-radius:1cqw;padding:.6cqw 1cqw;text-align:center}
.pc .w{font-size:1.8cqw;color:var(--muted);margin:1cqw 0;text-align:center}
.pc .ex{font-size:2.3cqw;line-height:1.6;font-weight:600}
.pc img{height:12cqw;width:auto;max-width:100%;object-fit:contain;margin:auto}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:1cqw;flex:1;min-height:0}
.rule{background:#fff;border-radius:1.4cqw;border:.35cqw solid var(--line);padding:.6cqw 1.4cqw;font-size:2.1cqw;line-height:1.45;display:flex;gap:1.2cqw;align-items:center}
.rule .ri{font-size:3.4cqw}
.mons{display:grid;grid-template-columns:repeat(4,1fr);gap:2cqw;flex:1;align-items:center}
.mon{background:#fff;border-radius:1.8cqw;border:.4cqw solid var(--line);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1cqw}
.mon img{height:9cqw;object-fit:contain}
.mon .d{width:8cqw;height:9.5cqw;border-radius:1.4cqw;background:#1F2430;color:var(--gold);display:grid;place-items:center;font-size:6.5cqw;font-weight:700;margin-top:1cqw}
.mon .d.hid{background:#EEE6D6;color:#B9AE97;font-size:6cqw}
.mon .why{font-size:1.6cqw;color:var(--muted);text-align:center;margin-top:.8cqw;min-height:4cqw}
body.locked main,body.locked nav{filter:blur(14px);pointer-events:none}
</style>
</head>
<body>
<header>
  <h1>🏰 Escape the Tower</h1><span id="netst" class="zh" style="font-size:15px;font-weight:700">連線中…</span><span style="flex:1"></span><button class="hb" onclick="PIN='';store.set('tp-pin','');askPin()">🔐 換老師碼</button>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<script>
const API_BASE = location.pathname.startsWith('/demo') ? '/api/demo' : '/api';
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const fmt=ms=>{const neg=ms<0;const s=Math.floor(Math.abs(ms)/1000);return (neg?'+':'')+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const MON=['m1','m2','m3','m4'];
const TC=()=>((SV&&SV.teacher&&SV.teacher.teamCount)||7);
const STAGE_PTS=10, ESC_BONUS=[10,7,5,3,3,3,3];

/* ===== LESSON PHASE TIMER ===== */
const PHASES=[{n:'開場 暖身',m:5},{n:'單字教學',m:15},{n:'密室逃脫',m:15},{n:'結尾 回顧',m:5}];
let P=store.get('tp-phase',{i:0,run:false,acc:0,since:0});
const pElapsed=()=>P.acc+(P.run?Date.now()-P.since:0);
function pToggle(){ if(P.run){P.acc+=Date.now()-P.since;P.run=false}else{P.since=Date.now();P.run=true} store.set('tp-phase',P); drawPhase(); }
function pNext(){ if(P.i<PHASES.length-1){ P={i:P.i+1,run:P.run,acc:0,since:Date.now()}; store.set('tp-phase',P); drawPhase(); } }
function pGo(i){ P={i,run:false,acc:0,since:0}; store.set('tp-phase',P); drawPhase(); }
function drawPhase(){ if(!$('#phases')) return;
  const el=pElapsed(), tot=PHASES[P.i].m*60000, left=tot-el;
  $('#phases').innerHTML=PHASES.map((p,i)=>`<button class="ph ${i===P.i?'on':''} ${i<P.i?'past':''}" onclick="pGo(${i})"><b>${p.n}</b><br>${p.m} 分<div class="bar" style="width:${i<P.i?100:i===P.i?Math.min(100,el/tot*100):0}%"></div></button>`).join('');
  const t=$('#ptime'); t.textContent=fmt(left); t.classList.toggle('over',left<0);
  $('#pplay').textContent=P.run?'⏸ 暫停':'▶ 開始';
}

/* ===== GAME STATE (synced with server) ===== */
let SV={room:null,now:0,teacher:{start:0,limit:11,bonus:{},adj:{},escAt:{},log:[]},teams:{}}, skew=0, online=null, lastSig='';
let PIN=store.get('tp-pin','');
async function api(path,body){
  const r=await fetch(API_BASE+path,{method:body?'POST':'GET',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined,cache:'no-store'});
  const j=await r.json().catch(()=>({}));
  if(r.status===401){ PIN=''; store.set('tp-pin',''); askPin(); throw new Error('pin'); }
  if(!r.ok) throw new Error(j.reason||'err');
  return j;
}
const snow=()=>Date.now()+skew;
async function poll(){
  try{ const j=await api('/state'); SV=j; skew=j.now-Date.now(); online=true; }catch(e){ online=false; }
  const sig=JSON.stringify([SV.teams,SV.teacher,SV.room,online]);
  if(sig!==lastSig){ lastSig=sig; if(tab==='board'||tab==='rank') drawMain(); }
  drawNet();
}
async function act(action,extra={}){
  if(!PIN){ askPin(); return; }
  try{ await api('/teacher',{pin:PIN,action,...extra}); }catch(e){ if(e.message!=='pin') toastModal('連線失敗，請再按一次'); }
  await poll();
}
function teamsView(){
  const T=SV.teacher||{}; const adj=T.adj||{}, escAtT=T.escAt||{}, bon=T.bonus||{};
  const arr=[];
  for(let n=1;n<=TC();n++){
    const r=SV.teams&&SV.teams[n]; const base=r?r.stage||0:0;
    const stage=Math.max(0,Math.min(5,base+(adj[n]||0)));
    const sa=(r&&r.stageAt)||{};
    const escAt=stage>=5?(sa[5]||escAtT[n]||null):null;
    const t0=T.start||(r&&r.joinedAt)||0;
    const times=[1,2,3,4,5].map(s=>sa[s]&&s<=stage?sa[s]-t0:null); if(escAt) times[4]=escAt-t0;
    arr.push({n,rec:r,stage,escAt,times,hints:r?r.hints||0:0,wrong:r?r.wrong||0:0,bonus:bon[n]||0,adj:adj[n]||0});
  }
  const order=arr.filter(t=>t.escAt).sort((a,b)=>a.escAt-b.escAt).map(t=>t.n);
  arr.forEach(t=>{ const e=order.indexOf(t.n); t.esc=e; t.score=Math.min(t.stage,4)*STAGE_PTS+(e>=0?(ESC_BONUS[e]??3):0)+t.bonus; });
  return arr;
}
function events(){
  const T=SV.teacher||{}; const ev=(T.log||[]).map(l=>({at:l.at,msg:l.msg}));
  for(let n=1;n<=TC();n++){ const r=SV.teams&&SV.teams[n]; if(!r) continue;
    ev.push({at:r.joinedAt,msg:`📱 第 ${n} 組加入`});
    Object.entries(r.stageAt||{}).forEach(([s,at])=>ev.push({at,msg:+s===5?`🔓 第 ${n} 組 成功逃脫！`:`✅ 第 ${n} 組 通過第 ${s} 關`})); }
  return ev.sort((a,b)=>b.at-a.at).slice(0,60);
}
function confirmBox(title,text,okLabel,fn){
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="box"><div style="font-size:22px;font-weight:700;margin-bottom:8px">${title}</div><p>${text}</p>
   <div class="row" style="justify-content:center"><button class="btn ghost" id="c0">取消</button><button class="btn red" id="c1">${okLabel}</button></div></div>`;
  document.body.appendChild(m); m.querySelector('#c0').onclick=()=>m.remove();
  m.querySelector('#c1').onclick=()=>{ m.remove(); fn(); };
}
function newClass(){ confirmBox('開始新的一班？','所有組別的進度、分數、紀錄都會清除。<br>學生 iPad 會<b>自動歸零</b>，不用一台一台重設。','清除並開始新的一班',()=>act('newclass')); }
function release(n){ confirmBox(`清除第 ${n} 組？`,`第 ${n} 組的進度會刪除，可以重新選組。<br>（用在學生選錯組、或換一台 iPad 的時候）`,'清除這一組',()=>act('release',{team:n})); }
function askPin(){
  if($('#pinbox')) return;
  const m=document.createElement('div'); m.className='modal'; m.id='pinbox';
  m.innerHTML=`<div class="box"><div style="font-size:40px">🔐</div><div style="font-size:22px;font-weight:700;margin-bottom:8px">老師登入</div><p>請輸入老師碼</p>
   <input id="pinin" type="password" inputmode="numeric" maxlength="8" style="font-size:28px;text-align:center;width:180px;padding:8px;border-radius:12px;border:2px solid var(--line);letter-spacing:6px">
   <p id="pinerr" style="color:var(--bad);min-height:20px"></p><button class="btn" id="pingo">進入</button></div>`;
  document.body.appendChild(m);
  const go=async()=>{ const v=$('#pinin').value.trim();
    try{ const r=await fetch(API_BASE+'/teacher',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pin:v,action:'check'})});
      if(r.ok){ PIN=v; store.set('tp-pin',v); m.remove(); document.body.classList.remove('locked'); poll(); draw(); } else $('#pinerr').textContent='老師碼不對';
    }catch(e){ $('#pinerr').textContent='連不上伺服器，請檢查網路'; } };
  $('#pingo').onclick=go; $('#pinin').onkeydown=e=>{ if(e.key==='Enter') go(); }; setTimeout(()=>$('#pinin').focus(),50);
}
function toastModal(msg){ const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div class="box"><div style="font-size:20px;font-weight:700">${msg}</div><div style="margin-top:12px"><button class="btn">好</button></div></div>`; document.body.appendChild(m); m.querySelector('button').onclick=()=>m.remove(); }
function drawNet(){ const el=$('#netst'); if(!el) return; el.textContent=online===false?'⚠ 連線中斷，重試中…':online?'🟢 即時同步中':'連線中…'; el.style.color=online===false?'#FF8A7A':'#9FE3B4'; }


/* ===== SLIDES ===== */
const VOC={
 hair:{t:'Hair 頭髮',ids:[['longhair','She has long hair.','長髮'],['shorthair','She has short hair.','短髮'],['straight','She has straight hair.','直髮'],['curly','He has curly hair.','捲髮'],['dark','He has dark hair.','深色頭髮'],['blonde','She has blonde hair.','金髮'],['bald',"He's bald.",'禿頭的']]},
 body:{t:'Age, Body & Face 年齡・身材・鬍子',ids:[['young',"He's young.",'年輕的'],['elderly',"He's elderly.",'年長的'],['tall',"She's tall.",'高的'],['short',"She's short.",'矮的'],['slim','She is slim.','苗條的'],['beard','He has a beard.','鬍子'],['moustache','He has a moustache.','小鬍子']]},
 clothes:{t:'Clothes 服裝配件',ids:[['glasses','glasses','眼鏡'],['scarf','a scarf','圍巾'],['gloves','gloves','手套'],['shoes','shoes','鞋子'],['cap','a cap','鴨舌帽'],['hat','a hat','帽子'],['trousers','trousers','長褲（美：pants）'],['handbag','a handbag','手提包'],['jacket','a jacket','夾克'],['jumper','a jumper','毛衣（美：sweater）']]},
};
const WP=['longhair','curly','beard','bald','blonde','dark','young','elderly'];

  return `<div class="qrwrap"><div id="qr"><span class="zh" style="color:var(--muted)">貼上學生網址後<br>會在這裡產生 QR code</span></div>
   <div><h2 style="margin-top:0">📱 學生網站</h2>
   <p>貼上學生網站的<b>公開連結</b>，就會產生 QR code，投影讓學生用 iPad 相機掃描。</p>
   <input class="url" id="url" placeholder="https://..." value="${studentURL.replace(/"/g,'')}" oninput="studentURL=this.value.trim();store.set('tp-url',studentURL);makeQR()">
   <p>若學生不小心重新整理，闖關進度會保留在該台 iPad 上。</p></div></div>`;
}
function makeQR(){
  const box=$('#qr'); if(!box) return;
  if(!studentURL){ return; }
  if(typeof QRCode==='undefined'){ box.innerHTML='<span class="zh">QR 產生器載入失敗，請直接把網址寫在黑板上</span>'; return; }
  box.innerHTML=''; new QRCode(box,{text:studentURL,width:300,height:300,correctLevel:QRCode.CorrectLevel.M});
}
function drawMain(){ $('#main').innerHTML=({show,board,rank,flow,ans,qr})[tab](); }
function draw(){ nav(); drawMain(); }
document.body.classList.add('locked');
draw();
if(PIN){ fetch(API_BASE+'/teacher',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pin:PIN,action:'check'})}).then(r=>{ if(r.ok){ document.body.classList.remove('locked'); } else { PIN=''; askPin(); } }).catch(()=>{ document.body.classList.remove('locked'); }); } else askPin();
poll(); setInterval(poll,2000);
</script>
</body>
